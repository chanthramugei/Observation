<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>MiniText Analyser</h2>
    <textarea id="main text" placeholder="start typing here.....!"></textarea><br>
    <div id="charactercount">0</div>
    <div id="wordcounter">0</div>
    <script>
        document.getElementById("main text").addEventListener("input",function(){
            let text=this.value;
            document.getElementById("charactercount").innerText=text.length;
            let trimmedtext=text.trim();
            let wordcount=trimmedtext===""?0:trimmedtext.split(/\s+/).length;
            document.getElementById("wordcounter").innerText=wordcount;
        })
    </script>
</body>
</html>
